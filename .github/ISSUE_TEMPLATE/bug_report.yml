name: Bug report
description: Something in DataBug doesn't work as it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste real passwords, connection strings or production data. For security problems use **Security → Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to a PostgreSQL 16 database
        2. Run `SELECT ...`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DataBug version
      description: Output of `databug --version`, or the release you downloaded
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.1, Windows 11 23H2, Ubuntu 24.04"
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      multiple: true
      options:
        - PostgreSQL
        - MySQL / MariaDB
        - SQL Server
        - SQLite
        - MongoDB
        - Not database-specific
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Database server version
      placeholder: "PostgreSQL 16.4, SQL Server 2022"
  - type: textarea
    id: logs
    attributes:
      label: Output, errors or screenshots
      description: Text from the Output tab, error messages, or screenshots.
      render: text
