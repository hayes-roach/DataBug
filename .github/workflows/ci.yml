name: CI

# Runs when commits are pushed, to any branch, not on pull request events:
# a pull request shows the result of its latest commit, so opening or
# updating one doesn't start a second build. Tags are built by release.yml.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# a newer commit on the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: store
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ppw" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Kerberos headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Seed databases
        run: |
          psql -h localhost -U postgres -c "create database store"
          psql -h localhost -U postgres -d store -v ON_ERROR_STOP=1 -f crates/databug-app/assets/sample.sql
          psql -h localhost -U postgres -d store -c "create schema audit; create table audit.events(id serial primary key, actor text, payload jsonb)"
          (echo "SET SESSION sql_mode='PIPES_AS_CONCAT,ANSI_QUOTES'; SET SESSION cte_max_recursion_depth=20000;"; cat crates/databug-app/assets/sample.sql) | mysql -h 127.0.0.1 -uroot -ppw store
      - name: Test
        run: cargo test --workspace --locked --features databug-drivers/kerberos
        env:
          DATABUG_TEST_PG: localhost:5432:store:postgres
          DATABUG_TEST_MYSQL: 127.0.0.1:3306:store:root:pw
      - name: Build release
        run: cargo build --release --locked --features kerberos

  # The oldest Rust that DataBug supports (rust-version in Cargo.toml). A
  # dependency update that needs a newer compiler fails here instead of
  # breaking builds for people on that version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: macOS app
        if: startsWith(matrix.os, 'macos')
        run: |
          rustup target add x86_64-apple-darwin
          packaging/macos/bundle.sh universal
      - name: Windows executable
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist/DataBug | Out-Null
          Copy-Item target/release/databug.exe dist/DataBug/DataBug.exe
          Copy-Item -Recurse crates/databug-app/assets/logos dist/DataBug/logos
          Compress-Archive -Path dist/DataBug/* -DestinationPath dist/DataBug-windows-x86_64.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging/windows/databug.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: DataBug-${{ startsWith(matrix.os, 'macos') && 'macos-universal' || 'windows-x86_64' }}
          path: |
            dist/DataBug-*.zip
            dist/DataBug-*.dmg
            dist/DataBug-*.exe
