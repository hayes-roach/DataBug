name: Release

# Push a tag like v0.2.0 to build DataBug for macOS, Windows and Linux and
# attach the downloads to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # DataBug-macos-universal.dmg (drag to Applications) and .zip
      - name: macOS installer
        if: startsWith(matrix.os, 'macos')
        env:
          DATABUG_FEATURES: --features kerberos
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          packaging/macos/bundle.sh universal

      # DataBug-windows-x86_64-setup.exe (installer) and a portable .zip
      - name: Windows installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          cargo build --release --locked
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist/DataBug | Out-Null
          Copy-Item target/release/databug.exe dist/DataBug/DataBug.exe
          Copy-Item -Recurse crates/databug-app/assets/logos dist/DataBug/logos
          Copy-Item LICENSE dist/DataBug/LICENSE.txt
          Copy-Item NOTICE dist/DataBug/NOTICE.txt
          Compress-Archive -Path dist/DataBug/* -DestinationPath dist/DataBug-windows-x86_64.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging/windows/databug.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # DataBug-linux-x86_64.tar.gz with install.sh (and install.sh --uninstall)
      - name: Linux installer
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev
          cargo build --release --locked --features kerberos
          mkdir -p DataBug dist
          cp target/release/databug DataBug/
          cp packaging/linux/databug.desktop packaging/linux/install.sh LICENSE NOTICE DataBug/
          cp crates/databug-app/assets/icon/icon.png DataBug/databug.png
          cp -r crates/databug-app/assets/logos DataBug/logos
          tar czf dist/DataBug-linux-x86_64.tar.gz DataBug

      - uses: actions/upload-artifact@v7
        with:
          name: DataBug-${{ matrix.name }}
          path: |
            dist/DataBug-*.dmg
            dist/DataBug-*.zip
            dist/DataBug-*.exe
            dist/DataBug-*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum DataBug-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            DataBug-*
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — open `DataBug-macos-universal.dmg` and drag DataBug to Applications, or run:
            ```
            curl -fsSL https://raw.githubusercontent.com/hayes-roach/DataBug/main/install.sh | sh
            ```
            **Windows** — run `DataBug-windows-x86_64-setup.exe`, or in PowerShell:
            ```
            irm https://raw.githubusercontent.com/hayes-roach/DataBug/main/install.ps1 | iex
            ```
            **Linux** — run:
            ```
            curl -fsSL https://raw.githubusercontent.com/hayes-roach/DataBug/main/install.sh | sh
            ```
            or extract `DataBug-linux-x86_64.tar.gz` and run `DataBug/install.sh`.
