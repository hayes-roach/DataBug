[package]
name = "databug-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["postgres", "mysql", "mssql", "sqlite", "mongodb", "cockroachdb", "timescaledb", "questdb", "h2", "duckdb", "cassandra", "couchdb", "influxdb"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]
mysql = ["dep:mysql_async", "dep:rustls"]
mssql = ["dep:tiberius", "dep:tokio-util", "dep:chrono"]
# Windows authentication on macOS/Linux through a Kerberos ticket (`kinit`).
# Needs the GSSAPI headers at build time (libkrb5-dev / krb5-devel); macOS has them.
# On Windows, Windows authentication is always built in (SSPI).
kerberos = ["mssql", "tiberius/integrated-auth-gssapi", "tokio/process"]
sqlite = ["dep:rusqlite"]
mongodb = ["dep:mongodb", "dep:json5"]
# Engines that speak the PostgreSQL wire protocol reuse the Postgres driver
# with their own introspection. H2 is reached through its PostgreSQL server
# mode (`-pg`).
cockroachdb = ["postgres"]
timescaledb = ["postgres"]
questdb = ["postgres"]
h2 = ["postgres"]
# DuckDB isn't compiled in: its official shared library (libduckdb) is
# downloaded on demand from DuckDB's GitHub releases, checked against a
# pinned SHA-256, and loaded at run time.
duckdb = ["dep:libloading", "dep:zip", "dep:sha2", "dep:reqwest", "dep:rustls", "dep:webpki-roots"]
cassandra = ["dep:scylla", "dep:rustls"]
# TLS for Cassandra. Not in the default build: scylla's rustls support turns
# on rustls' aws-lc crypto backend, a C library (needs cmake on some systems).
cassandra-tls = ["cassandra", "scylla/rustls-023"]
couchdb = ["dep:reqwest", "dep:json5", "dep:rustls"]
influxdb = ["dep:reqwest", "dep:rustls"]
# Not in the default build because they need software that isn't bundled:
# Oracle loads Oracle Instant Client at run time (nothing is needed to build).
oracle = ["dep:oracle"]
# Db2 and Spark go through ODBC: building needs the ODBC driver manager
# (unixODBC on macOS/Linux, built into Windows), and running needs the
# engine's ODBC driver (IBM Data Server Driver, Simba/Databricks Spark ODBC).
db2 = ["dep:odbc-api"]
spark = ["dep:odbc-api"]

[dependencies]
databug-core.workspace = true
databug-sql.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true

tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = { version = "0.26", optional = true }
mysql_async = { version = "0.36", optional = true, default-features = false, features = ["minimal-rust", "default-rustls-no-provider"] }
tiberius = { version = "0.12", optional = true, default-features = false, features = ["tds73", "rustls", "chrono", "winauth"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
rusqlite = { version = "0.37", optional = true, features = ["bundled", "column_decltype"] }
mongodb = { version = "3", optional = true }
json5 = { version = "0.4", optional = true }
libloading = { version = "0.8", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
sha2 = { version = "0.10", optional = true }
scylla = { version = "1", optional = true, default-features = false }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls-no-provider"] }
oracle = { version = "0.6", optional = true }
odbc-api = { version = "29", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
